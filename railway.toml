# Build phases (install remotion deps, system libs, browser) live in nixpacks.toml
# so they aren't overridden here. Don't add buildCommand back — it would replace
# the nixpacks.toml [phases.build] and skip `remotion browser ensure`.
[build]
builder = "nixpacks"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environments.production.deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
