# Nixpacks build for Railway. The default Node build can't render video, so this:
#   1. installs the system libraries Remotion's headless Chrome needs (aptPkgs),
#      plus ffmpeg for Telegram voice notes,
#   2. installs the nested remotion/ project's deps (own package + lockfile),
#   3. bakes the Chrome Headless Shell and the Kokoro TTS weights into the image
#      so neither has to download at runtime.
# Package list is Remotion's official Linux dependency set:
# https://www.remotion.dev/docs/miscellaneous/linux-dependencies

[phases.setup]
aptPkgs = [
  "libnss3",
  "libdbus-1-3",
  "libatk1.0-0",
  # Ubuntu 24.04 (noble, Railway's current base) renamed libasound2 -> libasound2t64.
  "libasound2t64",
  "libxrandr2",
  "libxkbcommon-dev",
  "libxfixes3",
  "libxcomposite1",
  "libxdamage1",
  "libgbm-dev",
  "libcups2",
  "libcairo2",
  "libpango-1.0-0",
  "libatk-bridge2.0-0",
  "fonts-liberation",
  "fontconfig",
  # Telegram voice notes: transcodes the TTS engine's WAV to OGG/Opus, the only
  # format Telegram renders as a voice message. Ubuntu's build has libopus.
  "ffmpeg",
]

# Overrides the default install phase — must install BOTH package trees.
[phases.install]
cmds = [
  "npm ci",
  "npm --prefix remotion ci",
]

# Overrides the default build phase — compile TS, then pre-download the browser
# so it's part of the image (runtime disk on Railway is ephemeral per deploy).
[phases.build]
cmds = [
  "npm run build",
  "cd remotion && npx remotion browser ensure",
  # Same idea for the Telegram voice model — cache it into node_modules now so
  # it's in the image rather than downloaded on the first 🔊 tap.
  "npm run prewarm:tts",
]
