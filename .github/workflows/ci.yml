name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/ci
      MONGODB_DB: ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            remotion/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Install video dependencies
        run: npm --prefix remotion ci

      - name: Verify types and tests
        run: npm run verify

      - name: Build Railway application
        run: npm run build
